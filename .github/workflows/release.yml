name: Build & Release

# Push a version tag to trigger a release, e.g.:
#   git tag v8.5.1 && git push origin v8.5.1
# Or run manually from the Actions tab (build artifacts, no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write          # required to create the GitHub Release

jobs:
  linux:
    runs-on: ubuntu-22.04   # glibc 2.35 -> broad compatibility for the raw bundle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history + tags, needed by setuptools-scm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (deps + app + pyinstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: xcb/GL libs (to bundle into the AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Resolve version
        run: echo "VERSION=$(python -c "from importlib.metadata import version; print(version('FlatCAM'))")" >> "$GITHUB_ENV"
      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm FlatCAM.spec
      - name: Tarball
        run: tar czf "FlatCAM-${VERSION}-linux-x86_64.tar.gz" -C dist FlatCAM
      - name: AppImage
        run: bash packaging/build_appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            FlatCAM-*-linux-x86_64.tar.gz
            FlatCAM-*-x86_64.AppImage

  # Windows uses Nuitka (compiled native binary): unlike the PyInstaller
  # bootloader, it is not flagged by antivirus engines (0/70 on VirusTotal,
  # vs 3/70 incl. Microsoft Defender for the PyInstaller .exe).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (deps + app + nuitka)
        run: |
          python -m pip install --upgrade pip
          pip install -e . nuitka
      - name: Build (Nuitka standalone)
        # anti-bloat can conflict with the Qt plugin over module inclusion; disable it.
        # --nofollow-import-to drops modules FlatCAM never uses: PIL's AVIF codec
        # (pulled in transitively by matplotlib, ~7.5 MB) and the Qt modules beyond
        # Core/Gui/Widgets. NB: this only removes the Python bindings (.pyd); the Qt
        # *DLLs* are copied by the pyside6 plugin regardless and are pruned below.
        run: python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 --enable-plugin=tk-inter --disable-plugin=anti-bloat --nofollow-import-to=PIL._avif --nofollow-import-to=PySide6.QtNetwork --nofollow-import-to=PySide6.QtPdf --nofollow-import-to=PySide6.QtQml --nofollow-import-to=PySide6.QtQuick --include-data-dir=share=share --include-package=tclCommands --output-dir=dist-nuitka --output-filename=flatcam.exe flatcam_run.py
      - name: Bundle rtree spatialindex DLLs
        # rtree loads spatialindex_c-64.dll (+ its dependency spatialindex-64.dll)
        # at runtime via ctypes from <rtree>/lib; Nuitka's data handling renames/
        # drops them, so copy the real DLLs into the dist where finder.py looks.
        shell: pwsh
        run: |
          $rtreeDir = python -c "import os, rtree; print(os.path.dirname(rtree.__file__))"
          $dest = "dist-nuitka/flatcam_run.dist/rtree/lib"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Get-ChildItem -Path $rtreeDir -Recurse -Filter "spatialindex*.dll" | ForEach-Object { Copy-Item $_.FullName $dest -Force }
          Get-ChildItem $dest
      - name: Prune unused Qt modules
        # FlatCAM uses only QtCore/QtGui/QtWidgets (+ Qt SVG for icons). The pyside6
        # plugin still ships Qt PDF and Qt Network (with its OpenSSL/TLS backends,
        # ~16 MB); nothing here loads them — version_check() uses urllib, not
        # QtNetwork. Verified with dumpbin that qt6gui/qt6widgets don't depend on
        # these DLLs. Keeps qt6svg.dll (icon loading).
        shell: pwsh
        run: |
          $dist = "dist-nuitka/flatcam_run.dist"
          $targets = @(
            "qt6pdf.dll", "qt6network.dll",
            "libcrypto-3-x64.dll", "libssl-3-x64.dll",
            "PySide6/QtNetwork.pyd", "PySide6/QtPdf.pyd"
          )
          foreach ($t in $targets) { $p = Join-Path $dist $t; if (Test-Path $p) { Remove-Item $p -Force; Write-Host "pruned $t" } }
          $tls = "$dist/PySide6/qt-plugins/tls"
          if (Test-Path $tls) { Remove-Item $tls -Recurse -Force; Write-Host "pruned qt-plugins/tls" }
      - name: Zip
        shell: pwsh
        run: |
          $v = (python -c "from importlib.metadata import version; print(version('FlatCAM'))")
          Compress-Archive -Path dist-nuitka/flatcam_run.dist/* -DestinationPath "FlatCAM-$v-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "FlatCAM-*-windows-x86_64.zip"

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    # Only publish a Release for tag pushes (manual runs just produce artifacts).
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
