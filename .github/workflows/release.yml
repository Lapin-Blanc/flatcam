name: Build & Release

# Push a version tag to trigger a release, e.g.:
#   git tag v8.5.1 && git push origin v8.5.1
# Or run manually from the Actions tab (build artifacts, no release).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write          # required to create the GitHub Release

jobs:
  linux:
    runs-on: ubuntu-22.04   # glibc 2.35 -> broad compatibility for the raw bundle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history + tags, needed by setuptools-scm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (deps + app + pyinstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: xcb/GL libs (to bundle into the AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-util1 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Resolve version
        run: echo "VERSION=$(python -c "from importlib.metadata import version; print(version('FlatCAM'))")" >> "$GITHUB_ENV"
      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm FlatCAM.spec
      - name: Tarball
        run: tar czf "FlatCAM-${VERSION}-linux-x86_64.tar.gz" -C dist FlatCAM
      - name: AppImage
        run: bash packaging/build_appimage.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            FlatCAM-*-linux-x86_64.tar.gz
            FlatCAM-*-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (deps + app + pyinstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyinstaller
      - name: Build PyInstaller bundle
        run: pyinstaller --noconfirm FlatCAM.spec
      - name: Zip
        shell: pwsh
        run: |
          $v = (python -c "from importlib.metadata import version; print(version('FlatCAM'))")
          Compress-Archive -Path dist/FlatCAM/* -DestinationPath "FlatCAM-$v-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "FlatCAM-*-windows-x86_64.zip"

  # Experimental: Nuitka build (compiled binary) to compare antivirus
  # false-positive rates against the PyInstaller .exe. Artifact only, not
  # attached to the release for now.
  windows-nuitka:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (deps + app + nuitka)
        run: |
          python -m pip install --upgrade pip
          pip install -e . nuitka
      - name: Build (Nuitka standalone)
        # anti-bloat can conflict with the Qt plugin over module inclusion; disable it.
        run: python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 --enable-plugin=tk-inter --disable-plugin=anti-bloat --include-data-dir=share=share --include-package=tclCommands --output-dir=dist-nuitka --output-filename=flatcam.exe flatcam_run.py
      - name: Zip
        shell: pwsh
        run: |
          $v = (python -c "from importlib.metadata import version; print(version('FlatCAM'))")
          Compress-Archive -Path dist-nuitka/flatcam_run.dist/* -DestinationPath "FlatCAM-$v-windows-x86_64-nuitka.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-nuitka
          path: "FlatCAM-*-windows-x86_64-nuitka.zip"

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    # Only publish a Release for tag pushes (manual runs just produce artifacts).
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
