[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FlatCAM"
dynamic = ["version"]          # version derived from git tags by setuptools-scm
description = "2D Computer-Aided PCB Manufacturing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Juan Pablo Caram" }]
keywords = ["cam", "pcb", "gerber", "cnc", "isolation-routing"]

# Pinned to modern, tested ranges (capped at the next major to block breaking
# changes -- e.g. shapely 2.x removed cascaded_union, numpy 2.x changed APIs).
# Lower bounds reflect the stack this fork actually targets, not the original
# 2013-era floors.
dependencies = [
    "PySide6>=6.5,<7",
    "numpy>=2.0,<3",
    "matplotlib>=3.5,<4",
    "shapely>=2.0,<3",
    "rtree>=1.0,<2",
    "svg.path>=7.0,<8",
    "simplejson>=3.17,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xvfb; sys_platform == 'linux'", "pip-audit", "ruff"]

[project.urls]
Homepage = "http://flatcam.org/"
Repository = "https://github.com/Lapin-Blanc/flatcam"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
# A blocked GUI test must fail, never hang CI. Thread method dumps the stack.
addopts = "-ra --timeout=120 --timeout-method=thread"

# GUI entry point: installs a `flatcam` launcher that calls FlatCAMApp.main().
[project.gui-scripts]
flatcam = "FlatCAMApp:main"

# Flat layout: explicit lists disable setuptools auto-discovery (which would
# choke on the many top-level modules). tests/, sandbox/, doc/ are excluded
# by omission.
[tool.setuptools]
py-modules = [
    "camlib",
    "FlatCAMApp",
    "FlatCAMCommon",
    "FlatCAMDraw",
    "FlatCAMGUI",
    "FlatCAMObj",
    "FlatCAMProcess",
    "FlatCAMShell",
    "FlatCAMTool",
    "FlatCAMVersion",
    "FlatCAMWorker",
    "GUIElements",
    "ObjectCollection",
    "ObjectUI",
    "PlotCanvas",
    "svgparse",
    "termwidget",
    "ToolDblSided",
    "ToolMeasurement",
    "ToolTransform",
]
packages = ["descartes", "tclCommands", "share"]

# Ship the icon/cursor resources as data inside the installed `share` package,
# so they land next to the modules. FlatCAMApp chdir()s to its own directory
# and loads them via relative "share/<file>" paths.
[tool.setuptools.package-data]
share = ["*.png", "*.gif", "*.svg", "*.ico"]

# Version comes from git tags (e.g. tag "v8.5.1" -> version 8.5.1).
# fallback_version is used when building outside a git checkout (e.g. sdist
# without .git, or a shallow clone with no tags).
# version_file writes the resolved version to _version.py at build/install time,
# so the running app (incl. the frozen Nuitka bundle) can read its real version.
[tool.setuptools_scm]
fallback_version = "8.5.0"
version_file = "_version.py"
